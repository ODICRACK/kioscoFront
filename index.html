<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Veloz</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
</head>

<body class="shift-manana" id="app-body">

    <!-- ================= VISTA HOME ================= -->
    <div id="view-home" class="view active">
        <div class="menu-container">
            <button onclick="navigate('view-catalogo')">Catálogo</button>
            <button onclick="navigate('view-stock')">Stock</button>
            <button onclick="navigate('view-venta')">Ventas</button>
            <button onclick="crearPromo()"
                style="background-color: #9c27b0; color: white; border: none;">Promos</button>
        </div>
    </div>

    <!-- ================= VISTA STOCK ================= -->
    <div id="view-stock" class="view">
        <div class="stock-header">
            <button class="btn-back" onclick="navigate('view-home')">←</button>
            <button class="btn-nuevo" onclick="crearProducto()">Nuevo Produc</button>
        </div>

        <div id="contenedor-stock-list">
            <!-- Aquí se renderizarán dinámicamente las categorías y productos -->
        </div>

        <div class="stock-footer">
            <button class="btn-nuevo" onclick="crearCategoria()">Nueva categoria</button>
        </div>
    </div>

    <!-- ================= VISTA CATALOGO ================= -->
    <div id="view-catalogo" class="view">
        <button class="btn-back" onclick="navigate('view-home')">←</button>

        <!-- Panel de filtros y recaudación -->
        <div class="filtros-catalogo">
            <div class="filtros-controles">
                <div>
                    <label>Día: </label>
                    <input type="date" id="filtro-fecha" onchange="filtrarCatalogo()">
                </div>
                <div>
                    <label>Turno: </label>
                    <select id="filtro-turno" onchange="filtrarCatalogo()">
                        <option value="todo">Todo el día</option>
                        <option value="manana">Mañana</option>
                        <option value="tarde">Tarde</option>
                        <option value="noche">Noche</option>
                    </select>
                </div>
            </div>

            <div class="recaudacion-container">
                <div class="recaudacion-box">
                    Total: $<span id="total-recaudado">0</span>
                </div>
                <div class="recaudacion-subtotales">
                    <div class="capsula-efectivo">💵 Efectivo: $<span id="total-efectivo">0</span></div>
                    <div class="capsula-transfe">📱 Transfe: $<span id="total-transfe">0</span></div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="tabla-ventas" style="width: 100%; text-align: left; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 2px solid #ccc; background: #eee; color: #333;">
                        <th style="padding: 10px;">Turno</th>
                        <th style="padding: 10px;">Monto</th>
                        <th style="padding: 10px;">Fecha y Hora</th>
                        <th style="padding: 10px;">Medio</th>
                    </tr>
                </thead>
                <tbody><!-- Llenado por JS --></tbody>
            </table>
        </div>
    </div>

    <!-- ================= VISTA VENTA ================= -->
    <div id="view-venta" class="view">

        <div class="turnos-botones">
            <button class="btn-back" onclick="navigate('view-home')">←</button>
            <button onclick="setShift('manana')">Mañana</button>
            <button onclick="setShift('tarde')">Tarde</button>
            <button onclick="setShift('noche')">Noche</button>
        </div>
        <!-- Panel superior de turnos y acciones -->
        <div class="turnos-container">
            <button onclick="eliminarUltimo()"
                style="background-color: #ff9800; color: white; border: none; font-weight: bold; border-radius: 4px;">Deshacer
                Último</button>



            <button onclick="limpiarVenta()"
                style="background-color: #ff4c4c; color: white; border: none; font-weight: bold; border-radius: 4px;">Limpiar
                Carrito</button>
        </div>

        <!-- Panel central de productos -->
        <div class="pos-layout">
            <div class="categorias-col" id="categorias-container">
                <!-- Categorías dinámicas -->
            </div>

            <div class="productos-col" id="productos-container">
                <!-- Productos dinámicos -->
            </div>
        </div>

        <!-- Panel inferior (Footer) -->
        <div class="footer-venta">
            <div class="pagos">
                <button id="btn-transferencia" onclick="setMetodoPago('transferencia')">Transfe</button>
                <button id="btn-efectivo" onclick="setMetodoPago('efectivo')">Efectivo</button>
            </div>
            <div class="total-display">
                $<span id="total-monto">0</span>
            </div>
            <button class="btn-venta-final" onclick="procesarVenta()">Venta</button>
        </div>
    </div> <!-- AQUÍ CIERRA CORRECTAMENTE LA VISTA VENTA -->

</body>

</html>
